{#
  kbd.html — keyboard key cap. Mirrors the `kbd(key)` macro.

  Args:
    key : display character (e.g. "←", "↵", "⌘K")
#}
<span class="inline-flex items-center justify-center min-w-[24px] h-6 px-1.5 rounded bg-slate-800 border border-slate-700 text-[11px] font-mono text-slate-300">{{ key }}</span>
