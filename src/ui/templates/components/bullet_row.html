{% from "components/_macros.html" import tag_chip %}
{#
  bullet_row.html — single bullet display row on Profile read-only.

  Args:
    bullet : dict with `text` and `tags` (list[str])
#}
<div class="flex gap-2 items-baseline text-sm text-slate-200 leading-relaxed">
  <span class="text-slate-500 mt-0.5 shrink-0" aria-hidden="true">•</span>
  <span class="flex-1 min-w-0">
    {{ bullet.text }}
    {% if bullet.tags %}
      <span class="ml-2 inline-flex flex-wrap gap-1 align-middle">
        {% for t in bullet.tags %}{{ tag_chip(t) }}{% endfor %}
      </span>
    {% endif %}
  </span>
</div>
