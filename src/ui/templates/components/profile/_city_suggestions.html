{# City-autocomplete suggestions — swapped into [data-city-suggestions]
   inside _search_prefs_editor.html. Each pick adds the normalized city
   and re-renders the whole prefs editor (closest [data-search-prefs]). #}
{% for m in items %}
<button type="button"
        class="flex items-center gap-2 px-3 py-1.5 text-left text-sm text-slate-200 hover:bg-slate-800 transition"
        hx-put="/api/v1/profile/search-prefs"
        hx-vals='{"action": "add_city", "city": {{ m.label | tojson }}}'
        hx-target="closest [data-search-prefs]"
        hx-swap="outerHTML"
        hx-indicator="closest [data-search-prefs] .search-prefs-indicator">
  <i data-lucide="map-pin" class="h-3.5 w-3.5 text-slate-500" stroke-width="1.5"></i>
  {{ m.label }}
</button>
{% endfor %}
