{#
  _settings_llm_model_field.html — model `<select>` rendered for one provider.

  Args:
    provider_id : str ("anthropic" / "openai" / "ollama")
    models      : list[str] (model identifiers in display order)
    selected    : str — currently-selected model id
#}
<select id="llm-model" name="llm_model"
        class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition">
  {% for m in models %}
    <option value="{{ m }}" {% if m == selected %}selected{% endif %}>{{ m }}</option>
  {% endfor %}
</select>
{% if provider_id == "ollama" %}
  <p class="mt-2 text-xs text-slate-500">
    Pulls from your local Ollama daemon. Custom models can be selected after
    saving — Naavik validates against <code class="font-mono">/api/tags</code>.
  </p>
{% endif %}
