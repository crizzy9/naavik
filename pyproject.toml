[project]
name = "naavik"
version = "0.2.6"
description = "Open-source, self-hosted career automation platform"
readme = "README.md"
license = { text = "AGPL-3.0" }
requires-python = ">=3.12"
authors = [
    { name = "Shyam Padia", email = "shyam.padia@gmail.com" }
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlmodel>=0.0.22",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.7.0",
    "jinja2>=3.1.5",
    "python-multipart>=0.0.20",
    "anthropic>=0.40.0",
    "openai>=1.58.0",
    "httpx>=0.28.0",
    "bcrypt>=4.2.0",
    "pyjwt>=2.10.0",
    "cryptography>=44.0.0",
    "apscheduler>=3.10.4",
    "pypdf>=5.1.0",
    # Pinned to match the chromium revision shipped by `pkgs.playwright-driver.browsers`
    # in our pinned nixpkgs (currently 1.58.2 → chromium-1208). Bumping pypi past
    # this without bumping the nixpkgs pin will produce a "Executable doesn't exist
    # at chromium_headless_shell-NNNN" error on NixOS. See plan 10a / PC.3.
    # Promoted from dev extras in plan 29 (0.2.0.06) — Crawl4AI requires Playwright
    # at module-import time, so the production runtime needs it on the base path.
    "playwright>=1.58.0,<1.59",
    # Scraper substrate (plan 29, 0.2.0.06). 0.8.6 is the post-litellm-supply-chain
    # hotfix release; older releases ship the compromised litellm transitively.
    # Exact pin keeps the lockfile deterministic; future bumps come after release
    # notes are read.
    "crawl4ai==0.8.6",
    # Fuzzy string scoring for tier-3 cross-source dedup (plan 34, 0.2.0.09).
    # Compiled C++ wheel; manylinux + macOS arm64 prebuilt; nixpkgs ships
    # `python312Packages.rapidfuzz`. token_set_ratio used in services/dedup.py.
    "rapidfuzz>=3.10.0,<4",
    # TTL cache for `scraper/url_guard._resolve_host` (plan 38, 0.2.0.13;
    # folds in 0.2.0.13a). Pure-Python; MIT; nixpkgs ships
    # `python312Packages.cachetools`. Bounds DNS-rebind TOCTOU window to 60s.
    "cachetools>=5.0,<6",
    # pgvector SQLAlchemy bindings for `JobEmbedding` + `embedding_service`
    # (plan 61, 0.2.7.16). 0.4.x is the stable API band; pulls `numpy`
    # transitively which needs `libz.so.1` at dlopen — devshell + flake
    # export the right LD_LIBRARY_PATH so `nix run .#dev` boots.
    "pgvector>=0.4.0,<0.5",
    # PDF text extraction for ATS parse-fidelity validator
    # (plan 66, 0.3.1, T9). Pure Python (depends on pdfminer.six). Used by
    # `services/ats_parser_fidelity.py` to round-trip the generated resume
    # PDF and score recovery of 8 canonical fields.
    "pdfplumber>=0.11.0,<0.12",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]

[project.scripts]
# Plan 50 (0.2.1.05, 2026-05-20): `src/cli/` deleted. The `naavik`
# script entry now boots uvicorn directly via `main:main`; the prior
# `cli.main:main` dispatcher is gone along with the `init` / `vault`
# / `serve` subparsers. `python -m main` and `uvicorn src.main:app`
# remain functionally identical. Future operator capabilities ship as
# Settings UI surfaces or `.env.example` slots per AGENTS.md § Key
# Conventions § CLI.
naavik = "main:main"
naavik-alembic = "alembic.config:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["api", "db", "llm", "models", "scheduler", "scraper", "scraper.sites", "services", "typst", "ui"]
py-modules = ["config", "main", "app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
# E501: line length handled by formatter
# B008: `Depends(...)` in function defaults is FastAPI's standard idiom
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
