[project]
name = "naavik"
version = "0.1.1"
description = "Open-source, self-hosted career automation platform"
readme = "README.md"
license = { text = "AGPL-3.0" }
requires-python = ">=3.12"
authors = [
    { name = "Shyam Padia", email = "shyam.padia@gmail.com" }
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlmodel>=0.0.22",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.7.0",
    "jinja2>=3.1.5",
    "python-multipart>=0.0.20",
    "anthropic>=0.40.0",
    "openai>=1.58.0",
    "httpx>=0.28.0",
    "bcrypt>=4.2.0",
    "pyjwt>=2.10.0",
    "cryptography>=44.0.0",
    "apscheduler>=3.10.4",
    "pypdf>=5.1.0",
    # Pinned to match the chromium revision shipped by `pkgs.playwright-driver.browsers`
    # in our pinned nixpkgs (currently 1.58.2 → chromium-1208). Bumping pypi past
    # this without bumping the nixpkgs pin will produce a "Executable doesn't exist
    # at chromium_headless_shell-NNNN" error on NixOS. See plan 10a / PC.3.
    # Promoted from dev extras in plan 29 (0.2.0.06) — Crawl4AI requires Playwright
    # at module-import time, so the production runtime needs it on the base path.
    "playwright>=1.58.0,<1.59",
    # Scraper substrate (plan 29, 0.2.0.06). 0.8.6 is the post-litellm-supply-chain
    # hotfix release; older releases ship the compromised litellm transitively.
    # Exact pin keeps the lockfile deterministic; future bumps come after release
    # notes are read.
    "crawl4ai==0.8.6",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]

[project.scripts]
# Plan 26 (0.2.0.01, 2026-05-19): `naavik init` + `naavik vault <...>`
# subcommands deleted with the encrypted vault. `naavik` (bare) and
# `naavik serve` are the only surfaces left; both run uvicorn. Plan
# 0.2.0.02 (queued) collapses to the bare invocation per AGENTS.md
# § Key Conventions § CLI sunset directive.
naavik = "cli.main:main"
naavik-alembic = "alembic.config:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["api", "cli", "db", "llm", "models", "scheduler", "scraper", "services", "typst", "ui"]
py-modules = ["config", "main", "app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
# E501: line length handled by formatter
# B008: `Depends(...)` in function defaults is FastAPI's standard idiom
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
