# Naavik self-host stack
#
# Quick start:
#   docker compose up -d
#
# .env (gitignored; auto-loaded if present):
#   cp .env.example .env && chmod 0600 .env  # then edit API keys, secrets
#
# Migrations run automatically before the app starts.
# All app state (PDFs, snapshots, logs) lives in the `naavik-data` volume.
# Plan 26 (0.2.0.01) removed the encrypted vault; secrets live in `.env`.

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: naavik-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: naavik
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: naavik
    volumes:
      - naavik-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naavik -d naavik"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot migration runner. Exits 0 on success; the app waits for it.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: naavik-migrate
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://naavik:${POSTGRES_PASSWORD:-password}@db:5432/naavik
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  naavik:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: naavik-app
    restart: unless-stopped
    # All env vars are optional. config.py provides working defaults.
    # Override here or in .env (auto-loaded by Compose).
    environment:
      DATABASE_URL: postgresql+asyncpg://naavik:${POSTGRES_PASSWORD:-password}@db:5432/naavik
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY must be set (see .env.example); generate with python -c 'import secrets; print(secrets.token_urlsafe(48))'}"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      PORTFOLIO_WEBHOOK_URL: ${PORTFOLIO_WEBHOOK_URL:-}
      # Container-internal bind remains 8000; published host port defaults to 8003 below.
      PORT: 8000
    ports:
      - "${PORT:-8003}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - naavik-data:/app/.naavik

volumes:
  naavik-db-data:
  naavik-data:
