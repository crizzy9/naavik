services:
  db:
    image: pgvector/pgvector:pg17
    container_name: naavik-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: naavik
      POSTGRES_PASSWORD: password
      POSTGRES_DB: naavik
    volumes:
      - naavik-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naavik -d naavik"]
      interval: 5s
      timeout: 5s
      retries: 5

  naavik:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: naavik-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://naavik:password@db:5432/naavik
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./generated:/app/generated

volumes:
  naavik-db-data:
